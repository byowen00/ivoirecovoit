name: iOS (vérification)

# Lancement à la main : construit l'application iOS sans signature, pour vérifier qu'elle compile.
# L'installer sur un iPhone demande une signature Apple (compte Apple Developer), voir docs/apk-android.md.
on: workflow_dispatch

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-latest
    defaults:
      run: { working-directory: apps/mobile }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "3.47.8", channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign --dart-define=API_BASE_URL=https://api.example.invalid --dart-define=APP_ENV=staging
