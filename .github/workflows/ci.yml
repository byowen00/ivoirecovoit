name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (NestJS + PostgreSQL/PostGIS)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: ivoirecovoit
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: ivoirecovoit
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ivoirecovoit" --health-interval 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-retries 20
      storage:
        image: rustfs/rustfs:1.0.4
        env:
          RUSTFS_ACCESS_KEY: ci-access
          RUSTFS_SECRET_KEY: ci-secret-key-not-real
        ports: ["9000:9000"]
    env:
      TEST_S3_ENDPOINT: http://127.0.0.1:9000
      TEST_S3_ACCESS_KEY: ci-access
      TEST_S3_SECRET_KEY: ci-secret-key-not-real
      TEST_DATABASE_URL: postgres://ivoirecovoit:ci-password@localhost:5432/ivoirecovoit_test
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Dépendances vulnérables (gravité haute ou critique)
        run: pnpm audit --prod --audit-level high
      - run: pnpm --filter @ivoirecovoit/backend lint
      - run: pnpm --filter @ivoirecovoit/backend typecheck
      - name: Attendre le stockage S3
        run: for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:9000/ && exit 0; sleep 2; done; exit 1
      - run: pnpm --filter @ivoirecovoit/backend test
      - run: pnpm --filter @ivoirecovoit/backend build

  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ivoirecovoit/web lint
      - run: pnpm --filter @ivoirecovoit/web typecheck
      - run: pnpm --filter @ivoirecovoit/web test
      - run: pnpm --filter @ivoirecovoit/web build
        env: { NEXT_TELEMETRY_DISABLED: "1" }

  mobile:
    name: Mobile (Flutter, build Android)
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: apps/mobile }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "3.47.8", channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug --dart-define=API_BASE_URL=https://api.example.invalid
      - uses: actions/upload-artifact@v4
        with:
          name: ivoirecovoit-debug-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
      # APK « release » signé, pour les essais sur téléphone. Sans les secrets ANDROID_KEYSTORE_*, une clé de TEST
      # jetable est créée pour l'occasion : l'APK s'installe, mais ne pourra pas être mis à jour par une version
      # signée avec la vraie clé (à créer avant la publication sur le Play Store, voir docs/apk-android.md).
      - name: Clé de signature (secrets du dépôt, sinon clé de test jetable)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/upload.jks
            PASS="$KEYSTORE_PASSWORD"; ALIAS="$KEY_ALIAS"
            echo "Signature avec la clé fournie dans les secrets du dépôt."
          else
            PASS=$(openssl rand -hex 16); ALIAS=essai
            keytool -genkeypair -keystore android/upload.jks -storetype PKCS12 -alias "$ALIAS" -keyalg RSA -keysize 3072 \
              -validity 365 -storepass "$PASS" -keypass "$PASS" -dname "CN=IvoireCovoit essai, O=IvoireCovoit, C=CI"
            echo "Signature avec une clé de TEST jetable (aucun secret de signature configuré)."
          fi
          printf 'storeFile=upload.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$PASS" "$ALIAS" "$PASS" > android/key.properties
      - name: APK signé de test
        run: >-
          flutter build apk --release
          --dart-define=API_BASE_URL=${{ vars.STAGING_API_URL || 'https://api.example.invalid' }}
          --dart-define=APP_ENV=staging
      - name: "Vérification de la signature et de la taille (ENF-02 : moins de 25 Mo)"
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          "$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)/apksigner" verify --print-certs "$APK" | grep -E "Signer #1 certificate (DN|SHA-256)"
          SIZE=$(stat -c %s "$APK")
          echo "Taille de l'APK : $((SIZE / 1024 / 1024)) Mo ($SIZE octets)" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$SIZE" -lt 26214400
          sha256sum "$APK" | tee -a "$GITHUB_STEP_SUMMARY"
          rm -f android/upload.jks android/key.properties
      - uses: actions/upload-artifact@v4
        with:
          name: ivoirecovoit-apk-test-signe
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  docker:
    name: Images Docker
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/backend/Dockerfile -t ivoirecovoit-backend .
      - run: docker build -f apps/web/Dockerfile -t ivoirecovoit-web .

  secrets:
    name: Recherche de secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
