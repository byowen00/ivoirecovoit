# Environnement de développement IvoireCovoit.
#   docker compose -f infrastructure/docker-compose.yml --env-file .env up -d
# Services de base : PostgreSQL + PostGIS, Redis. Profils facultatifs :
#   --profile app      : API et site web conteneurisés (sinon lancés avec pnpm en local)
#   --profile storage  : RustFS, stockage S3 privé des documents (étape 6) ; puis pnpm storage:init
#   --profile routing  : OSRM (routage, après préparation : infrastructure/osrm/prepare.sh)
name: ivoirecovoit

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ivoirecovoit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définir POSTGRES_PASSWORD dans .env}
      POSTGRES_DB: ${POSTGRES_DB:-ivoirecovoit}
    ports: ["127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"]  # POSTGRES_HOST_PORT si 5432 est déjà pris
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      # -h 127.0.0.1 : pendant la première initialisation, le serveur temporaire n'écoute pas en TCP.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-ivoirecovoit}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  backend:
    profiles: [app]
    build: { context: .., dockerfile: apps/backend/Dockerfile }
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://${POSTGRES_USER:-ivoirecovoit}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ivoirecovoit}
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: http://localhost:3001
      SWAGGER_ENABLED: "true"
      # Développement local uniquement : aucun SMS envoyé, code visible dans les logs et l'interface.
      OTP_TEST_MODE: "true"
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    profiles: [app]
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args: { API_INTERNAL_URL: "http://backend:3000" }
    environment:
      API_INTERNAL_URL: http://backend:3000 # lu à l'exécution par le relais de session (/bff)
    ports: ["127.0.0.1:3001:3001"]
    depends_on: [backend]

  storage:
    profiles: [storage]
    # Stockage compatible S3 (les images MinIO publiques ne sont plus publiées). Remplaçable par tout S3.
    image: rustfs/rustfs:1.0.4
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-ivoirecovoit}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?Définir S3_SECRET_KEY dans .env}
    ports: ["127.0.0.1:9000:9000"]
    volumes: [storagedata:/data]

  osrm:
    profiles: [routing]
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    command: ["osrm-routed", "--algorithm", "mld", "/data/ivory-coast-latest.osrm"]
    ports: ["127.0.0.1:5000:5000"]
    volumes: ["./osrm/data:/data"]

volumes:
  pgdata:
  redisdata:
  storagedata:
