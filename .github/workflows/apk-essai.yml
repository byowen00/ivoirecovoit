name: APK d'essai

# Lancement à la main (onglet Actions → « APK d'essai » → Run workflow) : APK qui se connecte à l'API lancée
# sur un ordinateur du même Wi-Fi que le téléphone (HTTP permis dans ce mode uniquement). Voir docs/tester.md.
on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "Adresse de l'API, par exemple http://192.168.1.20:3000"
        required: true

permissions:
  contents: write # publication de l'APK dans la version « apk-essai » (lien de téléchargement direct)

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: apps/mobile }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "3.47.8", channel: stable, cache: true }
      - run: flutter pub get
      - name: Construction
        env:
          API_URL: ${{ inputs.api_url }}
        run: |
          case "$API_URL" in http://*|https://*) ;; *) echo "Adresse invalide : $API_URL"; exit 1 ;; esac
          flutter build apk --profile --split-per-abi --target-platform android-arm,android-arm64 \
            --dart-define=API_BASE_URL="$API_URL" --dart-define=APP_ENV=development
          # APK universel (tous les processeurs, plus lourd) : pour un téléphone qui refuse les deux autres.
          flutter build apk --profile --dart-define=API_BASE_URL="$API_URL" --dart-define=APP_ENV=development
          echo "APK pour $API_URL : installer app-arm64-v8a-profile.apk (ou armeabi-v7a sur un ancien téléphone)." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ivoirecovoit-apk-essai
          path: apps/mobile/build/app/outputs/flutter-apk/app-*-profile.apk
          retention-days: 7
      # Lien fixe, téléchargeable depuis le navigateur du téléphone sans compte GitHub :
      # https://github.com/<dépôt>/releases/download/apk-essai/ivoirecovoit-essai-arm64.apk
      - name: Publication (lien de téléchargement direct)
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ inputs.api_url }}
        run: |
          cd build/app/outputs/flutter-apk
          cp app-arm64-v8a-profile.apk ivoirecovoit-essai-arm64.apk
          cp app-armeabi-v7a-profile.apk ivoirecovoit-essai-ancien-telephone.apk
          cp app-profile.apk ivoirecovoit-essai-universel.apk
          gh release view apk-essai >/dev/null 2>&1 || gh release create apk-essai --prerelease --target "$GITHUB_SHA" \
            --title "APK d'essai" --notes "APK d'essai (pas une version publique). Mis à jour à chaque construction."
          gh release upload apk-essai ivoirecovoit-essai-arm64.apk ivoirecovoit-essai-ancien-telephone.apk ivoirecovoit-essai-universel.apk --clobber
          gh release edit apk-essai --notes "APK d'essai, construit depuis ${GITHUB_SHA::7} pour $API_URL. Ce n'est pas une version publique."
          echo "Lien direct : https://github.com/${{ github.repository }}/releases/download/apk-essai/ivoirecovoit-essai-arm64.apk" >> "$GITHUB_STEP_SUMMARY"
